<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Down for the Count</title>
<meta name="description" content="Can't decide? Ask for a list of anything, then let the knockout pick one.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥊</text></svg>">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f5f2;
    --card: #ffffff;
    --text: #1d1b19;
    --muted: #6b6560;
    --border: #e4dfd9;
    --accent: #d9480f;
    --accent-text: #ffffff;
    --strike: #c92a2a;
    --win-bg: #fff4e6;
    --win-border: #f59f00;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141312;
      --card: #1f1d1b;
      --text: #f1ede9;
      --muted: #a39b94;
      --border: #34302c;
      --accent: #ff7a3d;
      --accent-text: #1a0d05;
      --strike: #ff6b6b;
      --win-bg: #2b2014;
      --win-border: #f59f00;
      --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: clamp(1.8rem, 6vw, 2.6rem); margin: 0 0 4px; letter-spacing: -.02em; }
  .tagline { color: var(--muted); margin: 0 0 14px; }

  .ideas { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 14px; }
  .ideas button {
    min-height: 0; padding: 6px 12px; border-radius: 999px; font-weight: 500;
    font-size: .88rem; color: var(--muted);
  }

  .tabs {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin: 0 0 16px;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 4px;
  }
  .tabs button { border: 0; min-height: 40px; padding: 8px 6px; font-size: .92rem; background: transparent; color: var(--muted); }
  .tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-text); }

  form { display: grid; grid-template-columns: 1fr 5.5rem auto; gap: 8px; }
  input, select, button, textarea {
    font: inherit; border-radius: 10px; border: 1px solid var(--border);
    padding: 12px 14px; background: var(--card); color: var(--text); min-height: 48px;
  }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  input[type="number"] { text-align: center; padding-inline: 8px; }
  #customForm { grid-template-columns: 1fr; }
  #customForm textarea { min-height: 120px; resize: vertical; }
  .hint { color: var(--muted); font-size: .85rem; margin: -4px 0 0; }

  .coin-area { display: grid; justify-items: center; gap: 18px; padding: 12px 0 8px; }
  .coin-stage { perspective: 900px; width: 170px; height: 170px; }
  .coin-stage.tossing { animation: toss 2.2s cubic-bezier(.3,.7,.4,1); }
  .coin {
    position: relative; width: 100%; height: 100%; transform-style: preserve-3d;
    transition: transform 2.2s cubic-bezier(.2,.8,.25,1);
  }
  .face {
    position: absolute; inset: 0; border-radius: 50%; backface-visibility: hidden;
    display: grid; place-items: center; font-weight: 800; font-size: 1.5rem; letter-spacing: .06em;
    color: #5c3d00; border: 6px solid #c9971c;
    background: radial-gradient(circle at 35% 30%, #fff3c4, #f5c542 45%, #d9a21b 80%);
    box-shadow: inset 0 0 0 4px rgba(255,255,255,.35), 0 8px 18px rgba(0,0,0,.25);
  }
  .face.tails { transform: rotateY(180deg); background: radial-gradient(circle at 35% 30%, #f1f3f5, #c4c9cf 45%, #9097a0 80%); color: #2b3036; border-color: #868e96; }
  .face span { font-size: 3rem; line-height: 1; display: block; text-align: center; }
  @keyframes toss { 0% { transform: translateY(0) } 40% { transform: translateY(-90px) scale(1.12) } 100% { transform: translateY(0) } }
  .coin-result { font-size: clamp(1.6rem, 7vw, 2.4rem); font-weight: 800; min-height: 1.3em; text-align: center; }
  .coin-tally { color: var(--muted); font-size: .9rem; }
  #flip { min-width: 200px; }
  button { cursor: pointer; font-weight: 600; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  @media (max-width: 520px) {
    form { grid-template-columns: 1fr 1fr; }
    form input { grid-column: 1 / -1; }
  }

  .status { min-height: 1.5em; margin: 14px 0 8px; color: var(--muted); }
  .status.error { color: var(--strike); }

  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .controls button { flex: 1 1 auto; }
  [hidden] { display: none !important; }

  ol#list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  ol#list li {
    position: relative; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 14px; box-shadow: var(--shadow);
    transition: opacity .5s ease, transform .5s ease, background .2s;
  }
  li .name { font-weight: 600; }
  li .meta { color: var(--muted); font-size: .88rem; }
  li .name a { color: inherit; text-decoration: none; }
  li .name a:hover { text-decoration: underline; }
  li .strike {
    position: absolute; left: 10px; right: 10px; top: 50%; height: 3px;
    background: var(--strike); border-radius: 2px;
    transform: scaleX(0); transform-origin: left; transition: transform .35s ease-out;
  }
  li.out .strike { transform: scaleX(1); }
  li.out { opacity: .38; transform: scale(.98); }
  li.flash { background: color-mix(in srgb, var(--strike) 18%, var(--card)); }

  .winner {
    text-align: center; background: var(--win-bg); border: 2px solid var(--win-border);
    border-radius: 18px; padding: 28px 18px; margin-bottom: 16px;
    animation: pop .5s cubic-bezier(.2,1.6,.4,1);
  }
  .winner .label { text-transform: uppercase; letter-spacing: .12em; font-size: .8rem; color: var(--muted); }
  .winner h2 { font-size: clamp(1.8rem, 8vw, 3rem); margin: 6px 0; line-height: 1.1; overflow-wrap: anywhere; }
  .winner p { margin: 0 0 16px; color: var(--muted); }
  .winner a.btn {
    display: inline-block; background: var(--accent); color: var(--accent-text);
    padding: 12px 20px; border-radius: 10px; font-weight: 700; text-decoration: none;
  }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: .01s !important; animation-duration: .01s !important; }
  }
  footer { margin-top: 32px; color: var(--muted); font-size: .8rem; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>🥊 Down for the Count</h1>
  <p class="tagline">Can't decide? Make a list of anything, then let fate strike them off one by one.</p>

  <div class="tabs" role="tablist" id="tabs">
    <button type="button" role="tab" aria-selected="true" data-panel="aiPanel">✨ Ask Gemini</button>
    <button type="button" role="tab" aria-selected="false" data-panel="customPanel">✍️ My list</button>
    <button type="button" role="tab" aria-selected="false" data-panel="coinPanel">🪙 Coin flip</button>
  </div>

  <section id="aiPanel" role="tabpanel">
    <div class="ideas" id="ideas">
      <button type="button">takeaway near Tuart Hill WA</button>
      <button type="button">colours to paint the bedroom</button>
      <button type="button">movies for a cosy night in</button>
      <button type="button">weekend activities in Perth</button>
    </div>

    <form id="search">
      <input id="q" type="search" placeholder="takeaway near Tuart Hill WA" required aria-label="What should we knock out?">
      <input id="count" type="number" inputmode="numeric" min="2" max="50" value="20" required aria-label="How many options (2 to 50)" title="How many options (2 to 50)">
      <button class="primary" id="go" type="submit">Get list</button>
    </form>
  </section>

  <section id="customPanel" role="tabpanel" hidden>
    <form id="customForm">
      <textarea id="customItems" required aria-label="Your options" placeholder="tree, frog, dog&#10;or one per line…"></textarea>
      <p class="hint">Separate options with commas or new lines.</p>
      <button class="primary" type="submit">Use my list</button>
    </form>
  </section>

  <div id="knockout">
    <div class="status" id="status" role="status" aria-live="polite"></div>

    <section id="winner" class="winner" hidden aria-live="polite"></section>

    <div class="controls" id="controls" hidden>
      <button class="primary" id="start" type="button">Start the knockout</button>
      <button id="reset" type="button">Reset</button>
    </div>

    <ol id="list"></ol>
  </div>

  <section id="coinPanel" role="tabpanel" hidden>
    <div class="coin-area">
      <div class="coin-stage" id="coinStage">
        <div class="coin" id="coin">
          <div class="face heads"><div><span>👑</span>HEADS</div></div>
          <div class="face tails"><div><span>🦘</span>TAILS</div></div>
        </div>
      </div>
      <div class="coin-result" id="coinResult" aria-live="polite"></div>
      <button class="primary" id="flip" type="button">Flip the coin</button>
      <div class="coin-tally" id="coinTally">Heads 0 · Tails 0</div>
    </div>
  </section>

  <footer>Gemini lists can be out of date, so tap through to Google Maps to check places before you go.</footer>
</main>

<script>
// Replaced at deploy time by the GitHub Actions workflow.
const API_KEY = "__GEMINI_API_KEY__";
// Tried in order; the next one is used if a model is missing, overloaded or out of free quota.
const MODELS = ["gemini-3.5-flash-lite", "gemini-flash-lite-latest", "gemini-3.8-flash", "gemini-flash-latest"];

const $ = id => document.getElementById(id);
let items = [];
let running = false;

function setStatus(msg, isError = false) {
  $("status").textContent = msg;
  $("status").classList.toggle("error", isError);
}

function buildPrompt(topic, n) {
  return `You are building the candidate list for a random "knockout" game, where options are struck off one by one until one is left.

Topic: "${topic}"

Return exactly ${n} distinct, varied options for this topic.
- If the topic is about real-world places (restaurants, takeaways, shops, venues, activities somewhere), list real, well-known places you are confident exist in or near the given location. Put the suburb and what kind of place it is in "detail", and a Google Maps search string "name, suburb, state" in "mapsQuery". Never invent places.
- For anything else (colours, films, names, ideas...), "detail" is a short, fun one-line description and "mapsQuery" is null.

Reply with ONLY this JSON and nothing else:
{"items":[{"name":"...","detail":"...","mapsQuery":null}]}`;
}

function parseItems(text) {
  const start = text.indexOf("{"), end = text.lastIndexOf("}");
  if (start < 0 || end < start) throw new Error("Gemini didn't return a list. Try again.");
  const data = JSON.parse(text.slice(start, end + 1));
  const seen = new Set();
  return (data.items || []).filter(it => {
    const key = String(it?.name || "").trim().toLowerCase();
    if (!key || seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

async function askGemini(topic, n) {
  let lastError;
  for (const model of MODELS) {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": API_KEY },
      body: JSON.stringify({
        contents: [{ parts: [{ text: buildPrompt(topic, n) }] }],
        generationConfig: { temperature: 1, responseMimeType: "application/json" },
      }),
    });
    const data = await res.json().catch(() => ({}));
    if ([404, 429, 500, 503].includes(res.status)) {
      lastError = new Error(res.status === 429 ? "Free limit reached for now. Try again later." : "Gemini is busy right now. Try again in a minute.");
      continue;
    }
    if (!res.ok) throw new Error(data.error?.message || `Request failed (${res.status})`);
    const text = (data.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("");
    return parseItems(text).slice(0, n);
  }
  throw lastError;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function mapsUrl(it) {
  return it.mapsQuery ? "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(it.mapsQuery) : "";
}

function metaText(it) {
  const r = typeof it.rating === "number" ? `★ ${it.rating.toFixed(1)}` : "";
  return [r, it.detail].filter(Boolean).join(" · ");
}

function render() {
  $("list").innerHTML = items.map((it, i) => {
    const url = mapsUrl(it);
    const name = url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(it.name)}</a>` : esc(it.name);
    return `
    <li data-i="${i}">
      <div class="name">${name}</div>
      <div class="meta">${esc(metaText(it))}</div>
      <span class="strike" aria-hidden="true"></span>
    </li>`;
  }).join("");
  $("controls").hidden = items.length < 2;
  $("start").disabled = false;
  $("winner").hidden = true;
}

$("ideas").addEventListener("click", e => {
  if (e.target.tagName !== "BUTTON" || running) return;
  $("q").value = e.target.textContent;
  $("search").requestSubmit();
});

$("search").addEventListener("submit", async e => {
  e.preventDefault();
  if (running) return;
  if (API_KEY.startsWith("__")) { setStatus("No API key configured for this build.", true); return; }
  const q = $("q").value.trim();
  const wanted = Math.min(50, Math.max(2, Math.round(Number($("count").value)) || 20));
  $("count").value = wanted;
  $("go").disabled = true;
  $("controls").hidden = true;
  $("winner").hidden = true;
  $("list").innerHTML = "";
  const t0 = Date.now();
  setStatus("Asking Gemini…");
  const tick = setInterval(() => setStatus(`Asking Gemini… ${Math.round((Date.now() - t0) / 1000)}s`), 1000);
  try {
    items = await askGemini(q, wanted);
    clearInterval(tick);
    if (items.length < 2) { setStatus("Couldn't get enough options. Try rewording it."); return; }
    setStatus(`${items.length} contenders${items.length < wanted ? ` (Gemini found ${items.length})` : ""}. Ready when you are.`);
    render();
  } catch (err) {
    clearInterval(tick);
    setStatus(`Couldn't get a list: ${err.message}`, true);
  } finally {
    $("go").disabled = false;
  }
});

$("customForm").addEventListener("submit", e => {
  e.preventDefault();
  if (running) return;
  const seen = new Set();
  items = $("customItems").value.split(/[\n,]+/).map(s => s.trim()).filter(s => {
    const key = s.toLowerCase();
    if (!s || seen.has(key)) return false;
    seen.add(key);
    return true;
  }).map(name => ({ name }));
  if (items.length < 2) { $("list").innerHTML = ""; $("controls").hidden = true; setStatus("Add at least two options.", true); return; }
  render();
  setStatus(`${items.length} contenders. Ready when you are.`);
});

$("tabs").addEventListener("click", e => {
  const tab = e.target.closest("button");
  if (!tab || running || coinBusy) return;
  for (const b of $("tabs").children) {
    b.setAttribute("aria-selected", b === tab);
    $(b.dataset.panel).hidden = b !== tab;
  }
  const isCoin = tab.dataset.panel === "coinPanel";
  $("knockout").hidden = isCoin;
  if (!isCoin) {
    // Each list mode starts with a clean board.
    items = [];
    $("list").innerHTML = "";
    $("controls").hidden = true;
    $("winner").hidden = true;
    setStatus("");
  }
});

let coinAngle = 0, coinBusy = false;
const tally = { Heads: 0, Tails: 0 };
$("flip").addEventListener("click", () => {
  if (coinBusy) return;
  coinBusy = true;
  $("flip").disabled = true;
  $("coinResult").textContent = "";
  const heads = crypto.getRandomValues(new Uint8Array(1))[0] < 128;
  // Always spin forward several full turns, landing on the chosen face.
  coinAngle = Math.ceil(coinAngle / 360) * 360 + 360 * 6 + (heads ? 0 : 180);
  $("coin").style.transform = `rotateY(${coinAngle}deg)`;
  const stage = $("coinStage");
  stage.classList.remove("tossing");
  void stage.offsetWidth; // restart the toss animation
  stage.classList.add("tossing");
  setTimeout(() => {
    const result = heads ? "Heads" : "Tails";
    tally[result]++;
    $("coinResult").textContent = `${heads ? "👑" : "🦘"} ${result}!`;
    $("coinTally").textContent = `Heads ${tally.Heads} · Tails ${tally.Tails}`;
    coinBusy = false;
    $("flip").disabled = false;
  }, 2250);
});

const sleep = ms => new Promise(r => setTimeout(r, ms));

$("start").addEventListener("click", async () => {
  if (running) return;
  running = true;
  $("start").disabled = true;
  $("go").disabled = true;
  $("reset").disabled = true;
  $("winner").hidden = true;

  const lis = [...$("list").children];
  lis.forEach(li => li.classList.remove("out", "flash"));
  const order = lis.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  const winnerIdx = order.pop();
  setStatus("Knocking them out…");

  for (let k = 0; k < order.length; k++) {
    const left = order.length - k; // contenders remaining besides the winner
    const delay = left > 4 ? 380 : [1700, 1250, 900, 650][left - 1];
    await sleep(delay);
    const li = lis[order[k]];
    li.classList.add("flash");
    li.scrollIntoView({ block: "nearest", behavior: "smooth" });
    await sleep(120);
    li.classList.remove("flash");
    li.classList.add("out");
    setStatus(`${left} left to knock out…`);
  }

  await sleep(600);
  const w = items[winnerIdx];
  const url = mapsUrl(w);
  $("winner").innerHTML = `
    <div class="label">The winner</div>
    <h2>${esc(w.name)}</h2>
    <p>${esc(metaText(w))}</p>
    ${url ? `<a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Open in Google Maps</a>` : ""}`;
  $("winner").hidden = false;
  $("winner").scrollIntoView({ block: "start", behavior: "smooth" });
  setStatus("We have a winner!");
  running = false;
  $("go").disabled = false;
  $("reset").disabled = false;
});

$("reset").addEventListener("click", () => {
  if (running) return;
  render();
  setStatus(`${items.length} contenders ready.`);
});
</script>
</body>
</html>
